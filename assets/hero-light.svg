<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="AHL8192 — Programmer, Designer, Writer, YouTuber">
  <title>AHL8192 — Programmer, Designer, Writer, YouTuber</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.55" stop-color="#DFEFFB"/>
      <stop offset="1" stop-color="#C8E6F7"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0B1B2B" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7EE0FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7EE0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC2FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4CC2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb" cx="0.35" cy="0.26" r="0.88">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#DFF9FF"/>
      <stop offset="0.42" stop-color="#6FD0F5"/>
      <stop offset="0.72" stop-color="#1F86BA"/>
      <stop offset="1" stop-color="#0A4064"/>
    </radialGradient>

    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8FC4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1F8FC4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1F8FC4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="1" stop-color="#12526F"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <circle cx="1080" cy="30" r="290" fill="url(#glowA)"/>
  <circle cx="1230" cy="340" r="300" fill="url(#glowB)"/>
  <circle cx="60" cy="360" r="260" fill="url(#glowC)"/>

  <ellipse cx="1030" cy="180" rx="200" ry="66" transform="rotate(-16 1030 180)" fill="none" stroke="url(#ring)" stroke-width="1.4" stroke-dasharray="3 7"/>
  <circle cx="1215" cy="128" r="4.5" fill="#1F8FC4"/>
  <circle cx="851" cy="234" r="3" fill="#4CC2FF" opacity="0.9"/>

  <circle cx="1030" cy="180" r="104" fill="url(#orb)"/>
  <ellipse cx="995" cy="141" rx="45" ry="27" transform="rotate(-28 995 141)" fill="url(#spec)"/>
  <circle cx="1030" cy="180" r="103" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
  <ellipse cx="1030" cy="272" rx="66" ry="11" fill="#1F8FC4" opacity="0.14" filter="url(#soft)"/>

  <rect x="84" y="103" width="28" height="1.5" fill="#1F8FC4"/>
  <text x="124" y="109" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.4" fill="#1F8FC4">AERO GLASS PROFILE</text>

  <text x="82" y="201" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="1" fill="url(#title)">AHL8192</text>

  <text x="84" y="243" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#4A6B7C">PROGRAMMER · DESIGNER · WRITER · YOUTUBER</text>

  <text x="84" y="287" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-style="italic" fill="#33525F" fill-opacity="0.85">Making old hardware feel new.</text>

  <rect x="0" y="0" width="1280" height="1" fill="#0B1B2B" fill-opacity="0.08"/>

  <g opacity="0.8">
    <rect x="-340" y="0" width="340" height="360" fill="url(#sheen)">
      <animate attributeName="x" from="-340" to="1280" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
